<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayne's Archive — A Pixel Capybara Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1c2c;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  body { color: #f4f4f4; user-select: none; cursor: crosshair; }

  /* --- Pixel font loaded from Google Fonts --- */
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  body, .dialog, .hud, .room-label, .tooltip { font-family: 'VT323', 'Courier New', monospace; }
  .title, .btn, .hud-title { font-family: 'Press Start 2P', 'Courier New', monospace; }

  /* --- The game world --- */
  #world {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      repeating-linear-gradient(0deg,  rgba(255,255,255,0.02) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px),
      radial-gradient(ellipse at center, #2a2f4a 0%, #0f1020 100%);
  }

  #canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    image-rendering: pixelated;
    cursor: pointer;
  }

  /* --- HUD --- */
  .hud {
    position: fixed;
    top: 16px; left: 16px;
    background: rgba(15, 16, 32, 0.85);
    border: 3px solid #f4f4f4;
    padding: 10px 14px;
    z-index: 100;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    max-width: 260px;
  }
  .hud-title {
    font-size: 11px;
    color: #ffcc00;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .hud-sub { font-size: 16px; color: #a7d2ff; line-height: 1.3; }
  .hud-hint {
    font-size: 14px;
    color: #888;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #444;
  }

  /* --- Lang + link buttons top-right --- */
  .top-controls {
    position: fixed;
    top: 16px; right: 16px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .btn {
    background: rgba(15, 16, 32, 0.85);
    color: #f4f4f4;
    border: 3px solid #f4f4f4;
    padding: 10px 14px;
    font-size: 10px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    transition: transform 0.1s;
  }
  .btn:hover { background: #ffcc00; color: #1a1c2c; transform: translate(-1px, -1px); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.5); }
  .btn.active { background: #ffcc00; color: #1a1c2c; }

  /* --- Dialog box --- */
  .dialog {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    width: min(760px, calc(100% - 32px));
    background: rgba(15, 16, 32, 0.95);
    border: 4px solid #f4f4f4;
    padding: 18px 22px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
  }
  .dialog.active { display: block; animation: popIn 0.2s ease-out; }
  @keyframes popIn { from { transform: translateX(-50%) translateY(8px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
  .dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid #444;
  }
  .dialog-speaker {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #ffcc00;
  }
  .dialog-close {
    background: transparent;
    border: 2px solid #888;
    color: #888;
    width: 26px; height: 26px;
    cursor: pointer;
    font-family: monospace;
    font-size: 14px;
    line-height: 1;
  }
  .dialog-close:hover { border-color: #ff4466; color: #ff4466; }
  .dialog-body {
    font-size: 20px;
    line-height: 1.5;
    color: #eee;
    min-height: 80px;
  }
  .dialog-body strong { color: #ffcc00; }
  .dialog-body a { color: #a7d2ff; text-decoration: underline; }
  .dialog-cursor { display: inline-block; color: #ffcc00; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .dialog-actions {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* --- Room label tooltip --- */
  .tooltip {
    position: fixed;
    background: rgba(15, 16, 32, 0.95);
    border: 2px solid #ffcc00;
    padding: 6px 10px;
    font-size: 16px;
    color: #ffcc00;
    pointer-events: none;
    z-index: 90;
    display: none;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  .tooltip.active { display: block; }

  /* --- Minimap --- */
  .minimap {
    position: fixed;
    bottom: 16px; right: 16px;
    width: 180px; height: 120px;
    background: rgba(15, 16, 32, 0.85);
    border: 3px solid #f4f4f4;
    padding: 6px;
    z-index: 90;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  }
  .minimap-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #ffcc00;
    margin-bottom: 4px;
  }
  #minimapCanvas { display: block; image-rendering: pixelated; }

  /* --- Start screen overlay --- */
  #startScreen {
    position: fixed;
    inset: 0;
    background: #0f1020;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.4s;
  }
  #startScreen.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .title {
    font-size: 36px;
    color: #ffcc00;
    text-shadow: 4px 4px 0 #ff4466, 8px 8px 0 #222;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.4;
  }
  .subtitle {
    font-size: 22px;
    color: #a7d2ff;
    margin-bottom: 40px;
    text-align: center;
  }
  .start-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: #ffcc00;
    color: #1a1c2c;
    border: 4px solid #f4f4f4;
    padding: 18px 36px;
    cursor: pointer;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.6);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .start-btn:hover { background: #fff; transform: scale(1.05); }
  .start-hints {
    margin-top: 30px;
    font-size: 16px;
    color: #888;
    text-align: center;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .hud { max-width: 200px; padding: 8px; }
    .hud-title { font-size: 9px; }
    .hud-sub { font-size: 13px; }
    .minimap { width: 120px; height: 80px; }
    .title { font-size: 22px; }
    .subtitle { font-size: 16px; }
    .start-btn { font-size: 11px; padding: 14px 24px; }
    .dialog-body { font-size: 17px; }
  }
</style>
</head>

function startGame() {

function applyLang() {

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('capy-lang', currentLang);
  applyLang();
}

const savedLang = localStorage.getItem('capy-lang');
if (savedLang) currentLang = savedLang;
applyLang();

// ============================================================
// Dialog system
// ============================================================
function showDialog({ intro, roomId }) {
  const t = i18n[currentLang];
  const body = document.getElementById('dialogBody');
  const actions = document.getElementById('dialogActions');
  const hudTitle = document.getElementById('hudTitle');
  const hudSub = document.getElementById('hudSub');

  actions.innerHTML = '';
  dialogOpen = true;

  if (intro) {
    currentDialogRoom = 'intro';
    typeOut(body, t.intro);
    hudTitle.textContent = t.hudPlaza;
    hudSub.textContent = t.hudPlazaSub;
  } else if (roomId) {
    currentDialogRoom = roomId;
    const room = t.rooms[roomId];
    typeOut(body, room.body);
    hudTitle.textContent = room.name;
    hudSub.textContent = room.hint;
  }

  document.getElementById('dialog').classList.add('active');
}

function closeDialog() {
  document.getElementById('dialog').classList.remove('active');
  dialogOpen = false;
  currentDialogRoom = null;
}

// Simple typewriter (instant on language toggle re-render)
function typeOut(el, html) {
  el.innerHTML = html;
}

// ============================================================
// Input handling
// ============================================================
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape') closeDialog();
  if ((e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'e') && activeRoomId && !dialogOpen) {
    showDialog({ roomId: activeRoomId });
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Click on canvas to move toward target OR open building
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / SCALE + camera.x;
  const my = (e.clientY - rect.top) / SCALE + camera.y;
  // Check if click is on a building
  for (const r of rooms) {
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
      showDialog({ roomId: r.id });
      return;
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / SCALE + camera.x;
  const my = (e.clientY - rect.top) / SCALE + camera.y;
  const tooltip = document.getElementById('tooltip');
  let found = null;
  for (const r of rooms) {
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) { found = r; break; }
  }
  if (found) {
    const t = i18n[currentLang].rooms[found.id];
    tooltip.innerHTML = `${t.name}<br><span style="color:#888;font-size:13px;">${t.hint}</span>`;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.classList.add('active');
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('active');
    canvas.style.cursor = 'crosshair';
  }
});

// Resize
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  SCALE = 1;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// Drawing helpers — pixel-art primitives
// ============================================================
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x - camera.x), Math.floor(y - camera.y), w, h);
}

function drawGround() {
  // base grass tile pattern
  for (let y = 0; y < WORLD.h; y += TILE) {
    for (let x = 0; x < WORLD.w; x += TILE) {
      if (x + TILE < camera.x || x > camera.x + canvas.width) continue;
      if (y + TILE < camera.y || y > camera.y + canvas.height) continue;
      // Two alternating greens for a checker vibe
      const c = ((x / TILE + y / TILE) % 2 === 0) ? '#4a7a3a' : '#4f8040';
      px(x, y, TILE, TILE, c);
      // sparse grass tufts
      if ((x * 7 + y * 13) % 97 === 0) {
        px(x + 4, y + 6, 2, 2, '#6b9d5a');
        px(x + 10, y + 3, 2, 2, '#6b9d5a');
      }
    }
  }
  // Paths connecting rooms (subtle dirt)
  ctx.fillStyle = '#8b7355';
  const pathY1 = 400, pathY2 = 580;
  ctx.fillRect(Math.floor(60 - camera.x), Math.floor(pathY1 - camera.y), WORLD.w - 120, 24);
  // vertical connector
  ctx.fillRect(Math.floor(WORLD.w/2 - camera.x - 12), Math.floor(pathY1 - camera.y), 24, pathY2 - pathY1);
}

function drawPond() {
  // Water
  px(pond.x, pond.y, pond.w, pond.h, '#3a6a9d');
  px(pond.x + 4, pond.y + 4, pond.w - 8, pond.h - 8, '#4e85bd');
  // tiny sparkles
  px(pond.x + 20, pond.y + 14, 2, 2, '#a7d2ff');
  px(pond.x + 80, pond.y + 40, 2, 2, '#a7d2ff');
  px(pond.x + 110, pond.y + 20, 2, 2, '#a7d2ff');
}

function drawDeco() {
  for (const d of deco) {
    if (d.x + 30 < camera.x || d.x - 30 > camera.x + canvas.width) continue;
    if (d.y + 30 < camera.y || d.y - 30 > camera.y + canvas.height) continue;
    if (d.type === 'tree') {
      // trunk
      px(d.x + 6, d.y + 14, 6, 10, '#5a3a1e');
      // leaves
      px(d.x, d.y, 20, 16, '#2d5a2a');
      px(d.x + 2, d.y - 4, 16, 6, '#3a7a3a');
      px(d.x + 5, d.y + 2, 3, 3, '#5a9d4a');
    } else {
      // bush
      px(d.x, d.y, 16, 10, '#2d5a2a');
      px(d.x + 2, d.y - 3, 12, 5, '#3a7a3a');
    }
  }
}

function drawBuilding(r, highlight) {
  // body
  px(r.x, r.y + 30, r.w, r.h - 30, r.color);
  // roof (triangle-ish)
  px(r.x - 4, r.y + 24, r.w + 8, 8, r.roof);
  px(r.x + 8, r.y + 16, r.w - 16, 8, r.roof);
  px(r.x + 20, r.y + 8, r.w - 40, 8, r.roof);
  // door
  const doorW = 28, doorH = 36;
  px(r.x + r.w/2 - doorW/2, r.y + r.h - doorH, doorW, doorH, '#2a1a10');
  px(r.x + r.w/2 + 6, r.y + r.h - doorH/2, 3, 3, '#ffcc00'); // knob
  // windows
  for (let i = 0; i < 2; i++) {
    const wx = r.x + 16 + i * (r.w - 48);
    px(wx, r.y + 50, 20, 20, '#a7d2ff');
    px(wx + 2, r.y + 52, 16, 16, '#6aa3d6');
    // window cross
    px(wx + 9, r.y + 50, 2, 20, '#2a1a10');
    px(wx, r.y + 59, 20, 2, '#2a1a10');
  }
  // sign above door (icon rendered as text emoji)
  ctx.font = '24px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(r.icon, Math.floor(r.x + r.w/2 - camera.x), Math.floor(r.y - camera.y));

  // Highlight border if active
  if (highlight) {
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(Math.floor(r.x - camera.x - 2), Math.floor(r.y - camera.y - 2), r.w + 4, r.h + 4);
    ctx.setLineDash([]);
  }

  // Label
  ctx.fillStyle = 'rgba(15,16,32,0.85)';
  const label = i18n[currentLang].rooms[r.id].name;
  ctx.font = '14px VT323, monospace';
  const tw = ctx.measureText(label).width;
  ctx.fillRect(Math.floor(r.x + r.w/2 - tw/2 - 6 - camera.x), Math.floor(r.y + r.h + 6 - camera.y), tw + 12, 20);
  ctx.fillStyle = '#ffcc00';
  ctx.textAlign = 'center';
  ctx.fillText(label, Math.floor(r.x + r.w/2 - camera.x), Math.floor(r.y + r.h + 20 - camera.y));
}

function drawCapybara() {
  const p = player;
  const screenX = Math.floor(p.x - camera.x);
  const screenY = Math.floor(p.y - camera.y);
  const bodyColor = '#a87c4a';
  const darkBody = '#7a5530';
  const noseColor = '#3d2515';
  const walkBob = p.moving ? Math.floor(Math.sin(p.walkTimer) * 2) : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(screenX - 2, screenY + p.h + 2, p.w + 4, 3);

  // Body (rounded rectangle in pixels)
  ctx.fillStyle = bodyColor;
  ctx.fillRect(screenX + 2, screenY + walkBob, p.w - 4, p.h);
  ctx.fillRect(screenX, screenY + 4 + walkBob, p.w, p.h - 8);

  // Belly highlight
  ctx.fillStyle = '#c59668';
  ctx.fillRect(screenX + 4, screenY + p.h - 6 + walkBob, p.w - 8, 3);

  // Legs (animate)
  const legOffset = p.moving ? (Math.floor(p.walkTimer / 2) % 2) : 0;
  ctx.fillStyle = darkBody;
  ctx.fillRect(screenX + 3, screenY + p.h - 2 + walkBob + legOffset, 3, 3);
  ctx.fillRect(screenX + p.w - 6, screenY + p.h - 2 + walkBob - legOffset, 3, 3);
  ctx.fillRect(screenX + 10, screenY + p.h + walkBob, 3, 2);
  ctx.fillRect(screenX + 18, screenY + p.h + walkBob, 3, 2);

  // Head (faces direction)
  const headX = p.dir === 'right' ? screenX + p.w - 10 : (p.dir === 'left' ? screenX - 2 : screenX + p.w/2 - 6);
  const headY = screenY - 4 + walkBob;
  ctx.fillStyle = bodyColor;
  ctx.fillRect(headX, headY, 12, 10);
  ctx.fillStyle = darkBody;
  // Ears
  ctx.fillRect(headX + 1, headY - 2, 2, 2);
  ctx.fillRect(headX + 9, headY - 2, 2, 2);
  // Eye
  ctx.fillStyle = '#000';
  if (p.dir === 'right') {
    ctx.fillRect(headX + 8, headY + 3, 2, 2);
  } else if (p.dir === 'left') {
    ctx.fillRect(headX + 2, headY + 3, 2, 2);
  } else {
    ctx.fillRect(headX + 3, headY + 3, 2, 2);
    ctx.fillRect(headX + 7, headY + 3, 2, 2);
  }
  // Nose
  ctx.fillStyle = noseColor;
  if (p.dir === 'right') ctx.fillRect(headX + 10, headY + 6, 2, 2);
  else if (p.dir === 'left') ctx.fillRect(headX, headY + 6, 2, 2);
  else ctx.fillRect(headX + 5, headY + 7, 2, 2);
}

function drawMinimap() {
  mctx.fillStyle = '#1a1c2c';
  mctx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);
  const sx = minimapCanvas.width / WORLD.w;
  const sy = minimapCanvas.height / WORLD.h;
  // Rooms
  for (const r of rooms) {
    mctx.fillStyle = r.color;
    mctx.fillRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
  }
  // Pond
  mctx.fillStyle = '#4e85bd';
  mctx.fillRect(pond.x * sx, pond.y * sy, pond.w * sx, pond.h * sy);
  // Player
  mctx.fillStyle = '#ffcc00';
  mctx.fillRect(player.x * sx - 2, player.y * sy - 2, 4, 4);
  // Viewport rect
  mctx.strokeStyle = '#f4f4f4';
  mctx.lineWidth = 1;
  mctx.strokeRect(camera.x * sx, camera.y * sy, canvas.width * sx, canvas.height * sy);
}

// ============================================================
// Collision / proximity
// ============================================================
function checkRoomProximity() {
  let closest = null;
  let minDist = Infinity;
  for (const r of rooms) {
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2;
    const dx = player.x + player.w/2 - cx;
    const dy = player.y + player.h/2 - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 100 && dist < minDist) {
      minDist = dist;
      closest = r;
    }
  }
  if (closest && closest.id !== activeRoomId) {
    activeRoomId = closest.id;
    if (!dialogOpen) {
      showDialog({ roomId: closest.id });
    }
  } else if (!closest && activeRoomId) {
    activeRoomId = null;
  }
}

function updatePlayer() {
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  const moving = dx !== 0 || dy !== 0;
  player.moving = moving;

  if (moving) {
    // normalize
    const len = Math.sqrt(dx*dx + dy*dy);
    dx /= len; dy /= len;
    // direction
    if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
    else player.dir = dy > 0 ? 'down' : 'up';

    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.walkTimer += 0.3;

    // clamp to world
    player.x = Math.max(0, Math.min(WORLD.w - player.w, player.x));
    player.y = Math.max(0, Math.min(WORLD.h - player.h, player.y));

    // simple pond collision (push out)
    if (player.x + player.w > pond.x && player.x < pond.x + pond.w &&
        player.y + player.h > pond.y && player.y < pond.y + pond.h) {
      // Push back
      player.x -= dx * player.speed * 2;
      player.y -= dy * player.speed * 2;
    }
  }

  // Camera follows player
  camera.x = player.x + player.w/2 - canvas.width/2;
  camera.y = player.y + player.h/2 - canvas.height/2;
  camera.x = Math.max(0, Math.min(WORLD.w - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - canvas.height, camera.y));

  checkRoomProximity();
}

// ============================================================
// Main loop
// ============================================================
function loop() {
  updatePlayer();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGround();
  drawPond();
  drawDeco();

  // Draw buildings (sort by y so closer ones appear in front)
  const sorted = [...rooms].sort((a, b) => a.y - b.y);
  for (const r of sorted) {
    drawBuilding(r, r.id === activeRoomId);
  }
  drawCapybara();
  drawMinimap();

  requestAnimationFrame(loop);
}
</script>
